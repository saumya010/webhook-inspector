services:
  app:
    build: .
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: webhook_inspector
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-20}
      REDIS_URL: redis://redis:6379
      API_KEY: ${API_KEY:-dev-local-key}
      PORT: 3000
      WEBHOOK_SECRET_GENERIC_TEST: test-secret-123
      WEBHOOK_SECRET_K6_LOAD_TEST: k6-load-secret
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_SERVICE_NAME: webhook-inspector-app
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    ports:
      - "3001:3001"
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: webhook_inspector
      REDIS_URL: redis://redis:6379
      WEBHOOK_SECRET_GENERIC_TEST: test-secret-123
      WEBHOOK_SECRET_K6_LOAD_TEST: k6-load-secret
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_SERVICE_NAME: webhook-inspector-worker
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MCP server is a stdio process spawned by an MCP client (Claude Desktop,
  # Claude Code, etc.), not a long-running network service — `profiles`
  # keeps it out of the default `docker compose up`. Run it directly with
  # `docker compose run --rm mcp` or point a client at
  # `docker compose run --rm -T mcp` as the launch command.
  mcp:
    build: .
    command: ["node", "dist/mcp/server.js"]
    profiles: ["tools"]
    stdin_open: true
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: webhook_inspector
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3002:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./observability/grafana-dashboard.json:/var/lib/grafana/dashboards/webhook-inspector.json:ro
    depends_on:
      - prometheus

volumes:
  mongo_data:
