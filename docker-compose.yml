services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: webhook_inspector
      REDIS_URL: redis://redis:6379
      API_KEY: ${API_KEY:-dev-local-key}
      PORT: 3000
      WEBHOOK_SECRET_GENERIC_TEST: test-secret-123
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: webhook_inspector
      REDIS_URL: redis://redis:6379
      WEBHOOK_SECRET_GENERIC_TEST: test-secret-123
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
